# Build and publish a GitHub release when the workspace version changes.
#
# Artifacts: Linux x86_64 (CPU/CUDA), Windows x86_64 (DirectML/CPU and CUDA).
#
# - push a workspace version change to main: build and publish that version.
# - push a matching v<version> tag: build and publish that exact version.
# - manual run: build the current version; publishing defaults to enabled.
name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise build artifacts only)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Detect version change
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          ver() { awk '/^\[workspace\.package\]$/{in_section=1; next} /^\[/{in_section=0} in_section && /^version[[:space:]]*=/ {gsub(/[[:space:]]/, "", $0); sub(/^version=\"/, "", $0); sub(/\"$/, "", $0); print; exit}' "$1"; }
          cur=$(ver Cargo.toml)
          if ! [[ "$cur" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::could not read a semver [workspace.package] version from Cargo.toml (got '$cur')"; exit 1
          fi
          prev=""
          if [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE:Cargo.toml" 2>/dev/null; then
            git show "$BEFORE:Cargo.toml" > /tmp/prev.toml && prev=$(ver /tmp/prev.toml)
          fi

          tag_exists=false
          git ls-remote --exit-code --tags origin "refs/tags/v$cur" >/dev/null 2>&1 && tag_exists=true

          build=false; publish=false
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            # Explicit tag pushes publish exactly the version encoded in the tag.
            if [[ ! "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::release tag '$REF_NAME' must look like vMAJOR.MINOR.PATCH"; exit 1
            fi
            tag_version="${BASH_REMATCH[1]}"
            if [[ "$cur" != "$tag_version" ]]; then
              echo "::error::tag v$tag_version does not match [workspace.package] version $cur in Cargo.toml"; exit 1
            fi
            build=true; publish=true
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            build=true
            # Allow a manual publish to refresh assets on an existing release too.
            [[ "$PUBLISH_INPUT" == "true" ]] && publish=true
          elif [[ "$cur" != "$prev" && "$tag_exists" == "false" ]]; then
            # A regular `git push origin` after bumping Cargo.toml on main
            # builds and publishes the new workspace version automatically.
            build=true; publish=true
          fi
          echo "Detected workspace version: $cur"
          echo "Previous workspace version: ${prev:-<none>}"
          echo "Git ref: $REF_TYPE $REF_NAME"
          echo "Release tag check: v$cur (exists: $tag_exists)"
          echo "Decision: build=$build publish=$publish" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "version=$cur"; echo "build=$build"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.variant }})
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: linux
            os: ubuntu-24.04
            features: ""
            asset: x86_64-linux
          - variant: linux-cuda
            os: ubuntu-24.04
            features: --features rembg-cli/cuda
            asset: x86_64-linux-cuda
          # Standard Windows build includes DirectML (any DX12 GPU) + CPU fallback.
          - variant: windows
            os: windows-2025
            features: ""
            asset: x86_64-windows
          # CUDA is an additional Windows build; DirectML stays compiled as a fallback option.
          - variant: windows-cuda
            os: windows-2025
            features: --features rembg-cli/cuda
            asset: x86_64-windows-cuda
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        if: runner.os == 'Linux'
        # libssl/pkg-config: ort's build script downloads ONNX Runtime over TLS.
        # Everything GUI-related (X11, Wayland, fontconfig) is dlopen'ed at runtime.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      - name: Test
        if: matrix.variant != 'linux-cuda' && matrix.variant != 'windows-cuda'
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked ${{ matrix.features }}

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          VARIANT: ${{ matrix.variant }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          name="rembg-$VERSION-$ASSET"
          dir="dist/$name"
          mkdir -p "$dir"
          cp README.md "$dir/"
          case "$VARIANT" in
            windows|windows-cuda)
              cp target/release/rembg.exe target/release/rembg-gui.exe "$dir/"
              # Include provider/runtime DLLs copied next to the executables by ort.
              find target/release -maxdepth 1 -iname '*.dll' -exec cp -L {} "$dir/" \;
              if [[ "$VARIANT" == "windows-cuda" ]]; then
                for dll in onnxruntime_providers_cuda.dll onnxruntime_providers_shared.dll; do
                  provider_path=$(find "$dir" -maxdepth 1 -iname "$dll" -print -quit)
                  if [[ -z "$provider_path" ]]; then
                    echo "::error::Windows CUDA package is missing $dll"
                    exit 1
                  fi
                done
                cat > "$dir/WINDOWS-CUDA.txt" <<'EOF'
          rembg Windows CUDA build

          This build includes the ONNX Runtime CUDA execution provider and DirectML.
          CUDA is preferred by Auto when available. DirectML can also be selected for
          supported DirectX 12 GPUs; CPU remains available as a fallback.

          Requires an Ampere-or-newer NVIDIA GPU, an NVIDIA driver >= 580, CUDA 13.x
          and a compatible cuDNN 9.x runtime. Their DLL directories must be on PATH.
          CUDA/cuDNN are not bundled in this archive.

          Check compiled providers with: rembg info
          EOF
              fi
              (cd dist && 7z a -tzip -mx=9 "$name.zip" "$name" >/dev/null)
              archive="$name.zip"
              ;;
            linux|linux-cuda)
              cp target/release/rembg target/release/rembg-gui "$dir/"
              if [[ "$VARIANT" == "linux-cuda" ]]; then
                # provider libs are symlinks into ort's download cache: copy the targets
                cp -L target/release/libonnxruntime_providers_cuda.so \
                      target/release/libonnxruntime_providers_shared.so "$dir/"
                cp scripts/fetch-cuda-libs.sh "$dir/"
                cat > "$dir/CUDA.txt" <<'EOF'
          rembg CUDA build (ONNX Runtime 1.31 / CUDA 13)

          Requires an NVIDIA driver >= 580 and an Ampere-or-newer GPU.

          The CUDA runtime (cudart, cuBLAS, cuDNN, cuFFT, cuRAND, NVRTC; ~2 GB) is not
          included. Fetch it once (needs python3); it goes into lib/ next to the binary:

              ./fetch-cuda-libs.sh

          rembg finds lib/ automatically, wherever it is run from. Without it, rembg runs on CPU.
          Check with:  ./rembg info
          EOF
              fi
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              archive="$name.tar.gz"
              ;;
          esac
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          ls -l "$dir" dist
          echo "- \`$archive\` ($(du -h "dist/$archive" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          set -euo pipefail
          bin=target/release/rembg; [[ "$RUNNER_OS" == "Windows" ]] && bin=target/release/rembg.exe
          "$bin" --version
          "$bin" models list

      - uses: actions/upload-artifact@v7
        with:
          name: rembg-${{ matrix.variant }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating its assets."
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "rembg v$VERSION" \
              --generate-notes
          fi
