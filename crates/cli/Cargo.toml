[package]
name = "rembg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rembg"
path = "src/main.rs"

# GUI launcher; on Windows it is a GUI-subsystem exe (no console window).
[[bin]]
name = "rembg-gui"
path = "src/gui_main.rs"

[features]
default = []
cuda = ["rembg-core/cuda"]

[dependencies]
rembg-core.workspace = true
rembg-gui.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
indicatif.workspace = true
arboard.workspace = true
tracing-subscriber.workspace = true
rfd.workspace = true
